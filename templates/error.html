{% extends 'base.html' %}

{% block content %}
<div class="card error-card">
    <h2>Oops! Something went wrong.</h2>
    <p>{{ message }}</p>
    <a href="/" class="button">Back to Home</a>
</div>

<style>
    .error-card {
        text-align: center;
        padding: 50px;
        margin-top: 50px;
    }
    .button {
        display: inline-block;
        background: var(--accent-color);
        color: white;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        margin-top: 20px;
    }
</style>
{% endblock %}
