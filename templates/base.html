<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense India</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>StockSense India</h1>
            <nav>
                <a href="/">Dashboard</a>
            </nav>
        </div>
    </header>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 StockSense India. For educational purposes only. Not financial advice.</p>
        {% if last_updated %}
        <p style="font-size: 0.8em; color: #888; margin-top: 5px;">Data as of: {{ last_updated }}</p>
        {% endif %}
    </footer>
</body>
</html>
