name: StockSense Scheduler

on:
  schedule:
    # 7:00 PM IST is 1:30 PM UTC
    - cron: '30 13 * * 1-5'
    # Every 3 hours on weekdays
    - cron: '0 */3 * * 1-5'
  workflow_dispatch:

jobs:
  run-batch:
    # Only run on 7:00 PM IST schedule OR when triggered manually
    if: github.event.schedule == '30 13 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Model Training
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python batch_train.py
      - name: Run Prediction Pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python batch_runner.py
      - name: Commit updated models
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add models/
          git commit -m "🤖 AI: Update trained models" || echo "No model changes to commit"
          git push

  run-3hr:
    # Only run on the 3-hour schedule
    if: github.event.schedule == '0 */3 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 3-Hour Updater
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python updates_3hr.py
