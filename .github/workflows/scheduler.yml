name: StockSense Scheduler

on:
  schedule:
    # 7:00 PM IST is 1:30 PM UTC
    - cron: '30 13 * * 1-5'
    # 8:30 AM IST is 3:00 AM UTC
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
jobs:
  run-batch:
    if: github.event.schedule == '30 13 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Batch Runner
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python batch_runner.py

  run-premarket:
    if: github.event.schedule == '0 3 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Premarket Runner
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python premarket_runner.py
